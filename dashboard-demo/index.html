<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>성과 대시보드 데모</title>
<meta name="description" content="석수연 포트폴리오 · 실제 운영 대시보드의 화면 구성을 가상 데이터로 재현한 데모" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="./demo.css?v=3" />
</head>
<body>
<div class="demo-bar">
  <span><b>DEMO · 가상 데이터</b> 실제 운영 중인 광고주 대시보드의 화면 구성을 그대로 두고, 숫자 · 브랜드 · 소재만 가상으로 바꿨습니다.</span>
  <a href="../#automation">← 포트폴리오로 돌아가기</a>
</div>
<header class="top">
  <div class="logo"><i>SAMPLE</i><span>Sample Brand<br />Dashboard</span></div>
  <div class="filters">
    <span class="dates"><input type="date" id="from" aria-label="시작일" /> ~ <input type="date" id="to" aria-label="종료일" /></span>
    <span class="seg" id="preset"><button data-p="7">7일</button><button data-p="14">14일</button><button data-p="last">지난달</button><button data-p="mtd">이번달</button><button data-p="all">전체</button></span>
    <span id="flt-da" class="filters"><select class="dd" id="f-camp" aria-label="Campaign"></select><select class="dd" id="f-obj" aria-label="Objective"></select><select class="dd" id="f-media" aria-label="Media"></select><select class="dd" id="f-ct" aria-label="Content Type"></select></span>
    <span id="flt-sa" class="filters" hidden><select class="dd" id="f-sam" aria-label="Media"></select></span>
    <button class="icon-btn" id="refresh" title="새로고침">⟳</button><button class="icon-btn" id="theme" title="다크 모드">☾</button>
  </div>
</header>
<main>
  <div class="tabs-row">
    <nav class="tabs" id="tabs">
      <button data-t="summary">Summary</button><button data-t="da">DA Performance</button><button data-t="sa">SA Performance</button><button data-t="keyword">Keyword Insights</button><button data-t="creative">Creative Asset</button><button data-t="mix">Media Mix</button><button data-t="trend">Campaign Trend</button><button data-t="admin">Admin</button><button data-t="upload">Data Upload</button>
    </nav>
    <span class="stamp" id="stamp"></span>
  </div>
  <div id="view"></div>
</main>
<footer>Demo · 가상 데이터 · 석수연 포트폴리오</footer>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="./data.js?v=3"></script>
<script src="./demo.js?v=3"></script>
</body>
</html>
